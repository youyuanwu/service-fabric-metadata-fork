# Standalone workspace so cargo does not walk up into the repo root looking for
# a parent manifest; this crate builds in isolation.
[workspace]

[package]
name = "sf-winmd-gen"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "sf-winmd-gen"

# Keep these crates on the same release because they share metadata and RDL
# contracts.
[dependencies]
windows-clang = "0.100.0"
windows-default = "0.100.0"
windows-rdl = "0.100.0"
windows-metadata = "0.100.0"
